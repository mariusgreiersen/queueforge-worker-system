# QueueForge local environment:  docker compose up --build
#   Dashboard  http://localhost:8080
#   API        http://localhost:3000   (OpenAPI docs at /docs)
#   Scale      docker compose up --build --scale worker=4
#
# Ports are published on 127.0.0.1 only. This file enables the demo crash controls for local use;
# never deploy it as-is to a reachable host (see "Security" in the README).
name: queueforge

x-worker-env: &worker-env
  REDIS_URL: redis://redis:6379
  QUEUE_PREFIX: ${QUEUE_PREFIX:-qf}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
  WORKER_LOCK_DURATION_MS: ${WORKER_LOCK_DURATION_MS:-15000}
  WORKER_STALLED_INTERVAL_MS: ${WORKER_STALLED_INTERVAL_MS:-5000}
  WORKER_MAX_STALLED_COUNT: ${WORKER_MAX_STALLED_COUNT:-2}
  WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-25000}
  WORKER_ALLOW_CRASH_COMMANDS: ${DEMO_CONTROLS_ENABLED:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    volumes:
      - redis-data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    # tini as PID 1: forwards signals and keeps Node out of PID 1's special signal semantics.
    init: true
    environment:
      REDIS_URL: redis://redis:6379
      QUEUE_PREFIX: ${QUEUE_PREFIX:-qf}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      DEMO_CONTROLS_ENABLED: ${DEMO_CONTROLS_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health/ready >/dev/null || exit 1']
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    stop_grace_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    # Required for the demo crash: Linux ignores SIGKILL sent by PID 1 to itself.
    init: true
    environment: *worker-env
    depends_on:
      redis:
        condition: service_healthy
    # No container_name: replicas need distinct names. Worker ids default to <hostname>-<pid>-<random>.
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    # Longer than WORKER_SHUTDOWN_TIMEOUT_MS so in-flight jobs can finish on `docker compose stop`.
    stop_grace_period: 30s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      target: dashboard
    ports:
      - '127.0.0.1:${DASHBOARD_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
