# Redis configuration for local QueueForge development.

# Persistence: append-only file fsynced every second (lose at most ~1 s of writes on a host crash),
# plus periodic RDB snapshots for faster restarts. Data lives in the redis-data volume.
appendonly yes
appendfsync everysec
save 300 10
save 60 1000
dir /data

# BullMQ requires noeviction: evicting queue keys would silently corrupt queue state.
maxmemory-policy noeviction

# Reachable only on the Compose network (and on 127.0.0.1 via the published port).
# A Redis reachable from untrusted networks must set a password (requirepass / ACLs) and TLS.
protected-mode no
bind 0.0.0.0
