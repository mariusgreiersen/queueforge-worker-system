# Serves the dashboard and proxies API calls to the api service, so the browser sees one origin.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Docker's embedded DNS; re-resolve so API restarts/scaling don't leave a stale upstream IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3000;

  # Server-Sent Events: no buffering, long read timeout.
  location = /api/v1/events {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location ~ ^/(api|health|docs)(/|$) {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 1m;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
