name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration and reliability tests (real Redis, real worker processes)
        run: npm run test:integration

      - name: Build API, worker and dashboard
        run: npm run build

      - name: Upload crash-recovery timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-recovery-observed
          path: tests/.results/
          if-no-files-found: ignore

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build all compose images
        run: docker compose build
